<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- 人形剪影：头部圆形 + 肩膀弧线，用作外层裁切保证轮廓清晰 -->
    <clipPath id="person">
      <circle cx="200" cy="155" r="62"/>
      <path d="M80 330 C80 264 134 225 200 225 C266 225 320 264 320 330 Z"/>
    </clipPath>
    <!-- 柔光：四组相近灰阶径向渐变，光源统一来自左上方 -->
    <radialGradient id="g1" cx="30%" cy="20%" r="95%">
      <stop offset="0%" stop-color="#e6e9ed"/>
      <stop offset="100%" stop-color="#ccd1d7"/>
    </radialGradient>
    <radialGradient id="g2" cx="30%" cy="20%" r="95%">
      <stop offset="0%" stop-color="#e2e5ea"/>
      <stop offset="100%" stop-color="#c5cad1"/>
    </radialGradient>
    <radialGradient id="g3" cx="30%" cy="20%" r="95%">
      <stop offset="0%" stop-color="#dde1e6"/>
      <stop offset="100%" stop-color="#bfc5cd"/>
    </radialGradient>
    <radialGradient id="g4" cx="30%" cy="20%" r="95%">
      <stop offset="0%" stop-color="#e9ecf0"/>
      <stop offset="100%" stop-color="#d2d6dc"/>
    </radialGradient>
  </defs>

  <!-- 碎片全部裁在人形剪影内：内部随意拼合，外轮廓始终利落 -->
  <g clip-path="url(#person)">
    <!-- 头部四块：微曲边 + 约 6px 呼吸拼缝 -->
    <path d="M197 94 A62 62 0 0 0 139 152 Q169 163 197 158 Z" fill="url(#g2)"/>
    <path d="M203 94 A62 62 0 0 1 261 152 Q231 163 203 158 Z" fill="url(#g4)"/>
    <path d="M139 160 A62 62 0 0 0 197 217 L197 166 Q168 171 139 160 Z" fill="url(#g3)"/>
    <path d="M261 160 A62 62 0 0 1 203 217 L203 166 Q232 171 261 160 Z" fill="url(#g1)"/>
    <!-- 身体六块：三列两行，有机曲线边 -->
    <path d="M95 279 C104 254 128 231 155 226 C158 244 158 261 155 279 Q125 283 95 279 Z" fill="url(#g1)"/>
    <path d="M161 226 C180 224 220 224 239 226 C242 244 242 261 239 279 Q200 283 161 279 C158 261 158 244 161 226 Z" fill="url(#g4)"/>
    <path d="M305 279 C296 254 272 231 245 226 C242 244 242 261 245 279 Q275 283 305 279 Z" fill="url(#g2)"/>
    <path d="M95 285 Q125 289 155 285 C157 300 157 315 154 330 L82 330 C85 315 90 300 95 285 Z" fill="url(#g4)"/>
    <path d="M161 285 Q200 289 239 285 C241 300 241 315 239 330 L161 330 C159 315 159 300 161 285 Z" fill="url(#g2)"/>
    <path d="M305 285 Q275 289 245 285 C243 300 243 315 246 330 L317 330 C314 315 310 300 305 285 Z" fill="url(#g3)"/>
  </g>

  <!-- 外轮廓描边：保持人形边缘清晰 -->
  <g fill="none" stroke="#b9bec5" stroke-width="1.5">
    <circle cx="200" cy="155" r="62"/>
    <path d="M80 330 C80 264 134 225 200 225 C266 225 320 264 320 330 Z"/>
  </g>
</svg>
