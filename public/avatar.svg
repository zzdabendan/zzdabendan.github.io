<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- 柔光径向渐变，光源来自左上方 -->
    <radialGradient id="gBody" cx="30%" cy="20%" r="95%">
      <stop offset="0%" stop-color="#e6e9ed"/>
      <stop offset="100%" stop-color="#ccd1d7"/>
    </radialGradient>
  </defs>

  <!-- 人形整体：头部圆形 + 肩膀弧线，纯色填充 -->
  <g fill="url(#gBody)">
    <circle cx="200" cy="155" r="62"/>
    <path d="M80 330 C80 264 134 225 200 225 C266 225 320 264 320 330 Z"/>
  </g>

  <!-- 外轮廓描边：保持人形边缘清晰 -->
  <g fill="none" stroke="#b9bec5" stroke-width="1.5">
    <circle cx="200" cy="155" r="62"/>
    <path d="M80 330 C80 264 134 225 200 225 C266 225 320 264 320 330 Z"/>
  </g>
</svg>
